<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>StarDawg – Launching</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #edf8ef;
      background:
        radial-gradient(circle at top left, rgba(60, 255, 138, 0.18), transparent 38%),
        radial-gradient(circle at 80% 20%, rgba(35, 165, 79, 0.14), transparent 32%),
        linear-gradient(180deg, #040806 0%, #020305 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      overflow: hidden;
    }

    .shell {
      position: relative;
      width: min(480px, 100%);
      padding: 2.5rem 2.25rem 2.75rem;
      border-radius: 1.6rem;
      border: 1px solid rgba(94, 255, 146, 0.22);
      background: radial-gradient(circle at top, rgba(60, 255, 138, 0.06), transparent 52%),
                  linear-gradient(160deg, rgba(10, 17, 12, 0.95), rgba4, 10, 6, 0.98);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(20px);
    }

    .brand-line {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      color: #9db4a2;
      margin-bottom: 1rem;
    }

    .title {
      font-family: "Cabinet Grotesk", system-ui, sans-serif;
      font-size: 2rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 0.25rem;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #9db4a2;
      line-height: 1.7;
      margin-bottom: 1.5rem;
    }

    .viewport {
      margin-top: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 900px;
    }

    .token-orbit {
      width: 170px;
      height: 170px;
      border-radius: 999px;
      padding: 10px;
      background:
        radial-gradient(circle at 30% 0%, rgba(60, 255, 138, 0.75), transparent 62%),
        radial-gradient(circle at 80% 80%, rgba(27, 184, 93, 0.4), transparent 52%);
      box-shadow:
        0 0 0 1px rgba(60, 255, 138, 0.35),
        0 0 45px rgba(60, 255, 138, 0.45),
        0 24px 70px rgba(0, 0, 0, 0.9);
      transform-style: preserve-3d;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .token-core {
      width: 100%;
      height: 100%;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background:
        radial-gradient(circle at 30% 0%, rgba255, 255, 255, 0.18, transparent 60%),
        #061008;
      transform-style: preserve-3d;
    }

    .token-core img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      filter: saturate(1.15) contrast(1.05);
      transform: translateZ(35px);
    }

    .spin-slow {
      animation: spinTokenSlow 12s linear infinite;
    }

    .spin-fast {
      animation: spinTokenFast 4s linear infinite;
    }

    @keyframes spinTokenSlow {
      0%   { transform: rotateY(0deg) rotateX(14deg); }
      100% { transform: rotateY(360deg) rotateX(14deg); }
    }

    @keyframes spinTokenFast {
      0%   { transform: rotateY(0deg) rotateX(14deg); }
      100% { transform: rotateY(720deg) rotateX(14deg); }
    }

    .status {
      margin-top: 1.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .status-line {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: #71847a;
    }

    .progress-shell {
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: rgba(13, 24, 16, 0.95);
      overflow: hidden;
      border: 1px solid rgba(94, 255, 146, 0.25);
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(135deg, #6effab, #26d172);
      box-shadow: 0 0 22px rgba(60, 255, 138, 0.7);
      animation: loadBar 9s ease-out forwards;
    }

    @keyframes loadBar {
      0%   { width: 0%; }
      30%  { width: 28%; }
      70%  { width: 72%; }
      100% { width: 100%; }
    }

    .note {
      font-size: 0.75rem;
      color: #9db4a2;
      margin-top: 0.4rem;
    }

    .hint {
      margin-top: 1.4rem;
      font-size: 0.78rem;
      color: #71847a;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="brand-line">StarDawg • Solana Native</div>
    <div class="title">Launching DAWG</div>
    <div class="subtitle">
      Professional startup sequence for the pack. Initializing the trading experience and loading the main site.
    </div>

    <div class="viewport">
      <div class="token-orbit">
        <div class="token-core spin-slow" id="dawgToken">
          <img src="./assets/stardawg-token-logo.jpeg" alt="StarDawg token" />
        </div>
      </div>
    </div>

    <div class="status">
      <div class="status-line" id="statusText">Phase 1 · Warming up the signal</div>
      <div class="progress-shell">
        <div class="progress-bar"></div>
      </div>
      <div class="note">Please wait while we prepare the main StarDawg page.</div>
      <div class="hint">You&apos;ll be automatically redirected once the sequence completes.</div>
    </div>
  </div>

  <script>
    const token = document.getElementById('dawgToken');
    const statusText = document.getElementById('statusText');

    setTimeout(() => {
      token.classList.remove('spin-slow');
      token.classList.add('spin-fast');
      statusText.textContent = 'Phase 2 · Accelerating for launch';
    }, 3500);

    setTimeout(() => {
      statusText.textContent = 'Phase 3 · Entering the StarDawg site';
      window.location.href = 'main.html';
    }, 9500);
  </script>
</body>
</html>
