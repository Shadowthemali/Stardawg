<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#040806">
  <title>StarDawg | Launching</title>
  <style>
    :root{color-scheme:dark;--bg:#040806;--panel:#0a1110;--text:#edf8ef;--muted:#9db4a2;--green:#3cff8a;--green2:#1bb85d}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;overflow:hidden;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;color:var(--text);background:radial-gradient(circle at 15% 10%,#163b254d,transparent 31%),radial-gradient(circle at 88% 80%,#0c522a42,transparent 32%),var(--bg)}.stars,.stars:before,.stars:after{position:absolute;inset:0;content:"";background-image:radial-gradient(#dfffe840 1px,transparent 1.5px);background-size:44px 44px;pointer-events:none}.stars:before{transform:rotate(24deg) scale(1.3);opacity:.55}.stars:after{transform:rotate(-16deg) scale(.75);opacity:.45}.panel{position:relative;z-index:1;width:min(520px,calc(100% - 32px));padding:clamp(30px,6vw,54px);text-align:center;border:1px solid #5eff9230;border-radius:30px;background:linear-gradient(145deg,#0f1d16e8,#060b08f2);box-shadow:0 40px 110px #000b,0 0 80px #3cff8a12;backdrop-filter:blur(18px)}.eyebrow{font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;color:var(--green);font-weight:800}.panel h1{margin:13px 0 8px;font-size:clamp(2rem,7vw,3.55rem);line-height:.96;letter-spacing:-.06em}.panel p{margin:0 auto;max-width:37ch;color:var(--muted);line-height:1.65}.stage{height:230px;margin:26px 0 21px;display:grid;place-items:center;perspective:900px}.ring{width:190px;height:190px;display:grid;place-items:center;border-radius:50%;background:conic-gradient(from 0deg,#3cff8a,#1b673b 17%,transparent 34%,#3cff8a 52%,transparent 69%,#1bb85d 85%,#3cff8a);box-shadow:0 0 35px #3cff8a77,inset 0 0 22px #3cff8a55;animation:orbit 5s linear infinite}.coin{width:165px;height:165px;padding:7px;border-radius:50%;background:linear-gradient(135deg,#6effab,#0a4726);box-shadow:inset 0 0 0 1px #d9ffe866,0 20px 42px #000b;animation:spinSlow 10s linear infinite;transform-style:preserve-3d}.coin.fast{animation:spinFast 2.35s linear infinite}.coin img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;border:1px solid #ffffff28;background:#061008;transform:translateZ(18px)}.load-label{display:flex;justify-content:space-between;gap:16px;margin:0 0 10px;font-size:.71rem;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}.bar{height:7px;overflow:hidden;border-radius:20px;background:#142119;border:1px solid #5eff9229}.bar i{display:block;width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--green2),var(--green));box-shadow:0 0 20px #3cff8a;animation:load 9s cubic-bezier(.2,.8,.2,1) forwards}.skip{display:inline-block;margin-top:25px;color:var(--green);font-size:.76rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;text-decoration:none}.skip:hover,.skip:focus-visible{color:#fff}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes spinSlow{to{transform:rotateY(360deg) rotateX(10deg)}}@keyframes spinFast{to{transform:rotateY(720deg) rotateX(10deg)}}@keyframes load{15%{width:18%}45%{width:48%}75%{width:80%}100%{width:100%}}@media (prefers-reduced-motion:reduce){.ring,.coin,.coin.fast,.bar i{animation:none}.bar i{width:100%}}
  </style>
</head>
<body>
  <div class="stars"></div>
  <main class="panel">
    <div class="eyebrow">Solana native · DAWG</div>
    <h1>Preparing the signal.</h1>
    <p>Initializing the StarDawg experience for the pack.</p>
    <div class="stage"><div class="ring"><div class="coin" id="coin"><img src="./assets/stardawg-token-logo.jpeg" alt="StarDawg token"></div></div></div>
    <div class="load-label"><span id="state">Warming up</span><span id="percent">0%</span></div>
    <div class="bar"><i></i></div>
    <a class="skip" href="index.html">Enter site now →</a>
  </main>
  <script>
    const coin=document.getElementById('coin'),state=document.getElementById('state'),percent=document.getElementById('percent');
    setTimeout(()=>{coin.classList.add('fast');state.textContent='Accelerating';percent.textContent='42%'},3200);
    setTimeout(()=>{state.textContent='Entering StarDawg';percent.textContent='100%'},8200);
    setTimeout(()=>location.replace('index.html'),9200);
  </script>
</body>
</html>
